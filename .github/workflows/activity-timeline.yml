name: Update Activity Timeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch & Render Activity
        uses: FreddyMSchubert/github-activity-timeline@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: annasehgal
          max_items: "5"
          event_templates: |
            {
              "pr_opened": "{{index}}. Opened PR [{{repo}}#{{payload.pull_request.number}}]({{payload.pull_request.html_url}})",
              "pr_merged": "{{index}}. Merged PR [{{repo}}#{{payload.pull_request.number}}]({{payload.pull_request.html_url}})",
              "issues_opened": "{{index}}. Opened issue [{{repo}}#{{payload.issue.number}}]({{payload.issue.html_url}})",
              "issues_closed": "{{index}}. Closed [{{repo}}#{{payload.issue.number}}]({{payload.issue.html_url}})"
            }

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md && git diff --cached --quiet || git commit -m "chore: update activity"
      
      - uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
